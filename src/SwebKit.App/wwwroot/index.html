<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SwebKit</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="SwebKit.App.styles.css" />
    <link rel="icon" href="data:,">
</head>
<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#x2715;</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="js/keyboardShortcuts.js"></script>
    <script src="js/monacoLoader.js"></script>
    <script src="js/splitter.js"></script>
    <script src="js/uiState.js"></script>
    <script src="js/yamlHighlight.js"></script>
    <script>
        // Initialize Mermaid for SwebKit (v10+ async API)
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });

        // ── Mermaid lightbox with pan/zoom ───────────────────────────────────
        (function () {
            var overlay, viewport, activeSvg;
            var scale, panX, panY;
            var isDragging, startX, startY, startPanX, startPanY;

            function ensureOverlay() {
                if (overlay) return;

                var style = document.createElement('style');
                style.textContent =
                    '.mermaid-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center}' +
                    '.mermaid-overlay-box{background:#16161e;border:1px solid rgba(255,255,255,.12);border-radius:10px;width:94vw;height:90vh;display:flex;flex-direction:column;box-shadow:0 16px 56px rgba(0,0,0,.8);overflow:hidden}' +
                    '.mermaid-overlay-toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;gap:12px}' +
                    '.mermaid-overlay-hint{font-size:11px;color:#555;font-family:monospace;white-space:nowrap}' +
                    '.mermaid-overlay-close{background:none;border:none;color:#777;font-size:22px;line-height:1;cursor:pointer;padding:0 4px;flex-shrink:0}' +
                    '.mermaid-overlay-close:hover{color:#fff}' +
                    '.mermaid-overlay-viewport{flex:1;overflow:hidden;cursor:grab;position:relative;user-select:none}' +
                    '.mermaid-overlay-viewport.dragging{cursor:grabbing}' +
                    '.mermaid-overlay-viewport svg{position:absolute;top:0;left:0;transform-origin:0 0}';
                document.head.appendChild(style);

                overlay = document.createElement('div');
                overlay.className = 'mermaid-overlay';
                overlay.style.display = 'none';
                overlay.innerHTML =
                    '<div class="mermaid-overlay-box">' +
                    '<div class="mermaid-overlay-toolbar">' +
                    '<span class="mermaid-overlay-hint">Scroll\u202fto zoom \u00b7 Drag\u202fto pan \u00b7 Double-click\u202fto fit</span>' +
                    '<button class="mermaid-overlay-close" aria-label="Close">\u00d7</button>' +
                    '</div>' +
                    '<div class="mermaid-overlay-viewport"></div>' +
                    '</div>';
                document.body.appendChild(overlay);
                viewport = overlay.querySelector('.mermaid-overlay-viewport');

                // Close
                overlay.querySelector('.mermaid-overlay-close').addEventListener('click', close);
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && overlay.style.display !== 'none') close();
                });

                // Wheel zoom toward cursor
                viewport.addEventListener('wheel', function (e) {
                    e.preventDefault();
                    var rect = viewport.getBoundingClientRect();
                    var mx = e.clientX - rect.left;
                    var my = e.clientY - rect.top;
                    var factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
                    var next = Math.min(10, Math.max(0.05, scale * factor));
                    panX = mx - (mx - panX) * (next / scale);
                    panY = my - (my - panY) * (next / scale);
                    scale = next;
                    applyTransform();
                }, { passive: false });

                // Drag pan
                viewport.addEventListener('mousedown', function (e) {
                    if (e.button !== 0) return;
                    isDragging = true;
                    startX = e.clientX; startY = e.clientY;
                    startPanX = panX; startPanY = panY;
                    viewport.classList.add('dragging');
                    e.preventDefault();
                });
                document.addEventListener('mousemove', function (e) {
                    if (!isDragging) return;
                    panX = startPanX + (e.clientX - startX);
                    panY = startPanY + (e.clientY - startY);
                    applyTransform();
                });
                document.addEventListener('mouseup', function () {
                    if (isDragging) { isDragging = false; viewport.classList.remove('dragging'); }
                });

                // Double-click to fit
                viewport.addEventListener('dblclick', fit);
            }

            function applyTransform() {
                if (activeSvg) activeSvg.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
            }

            function fit() {
                if (!activeSvg) return;
                var vw = viewport.clientWidth;
                var vh = viewport.clientHeight;
                var vb = activeSvg.viewBox.baseVal;
                var svgW = vb && vb.width ? vb.width : activeSvg.getBoundingClientRect().width;
                var svgH = vb && vb.height ? vb.height : activeSvg.getBoundingClientRect().height;
                scale = svgW && svgH ? Math.min(vw / svgW, vh / svgH) * 0.92 : 1;
                panX = svgW ? (vw - svgW * scale) / 2 : 0;
                panY = svgH ? (vh - svgH * scale) / 2 : 0;
                applyTransform();
            }

            function close() {
                if (overlay) overlay.style.display = 'none';
            }

            window.openMermaidLightbox = function (svgContent) {
                ensureOverlay();
                viewport.innerHTML = svgContent;
                activeSvg = viewport.querySelector('svg');
                if (activeSvg) {
                    activeSvg.removeAttribute('width');
                    activeSvg.removeAttribute('height');
                    activeSvg.style.transformOrigin = '0 0';
                }
                overlay.style.display = 'flex';
                // Two rAF ticks so the SVG is laid out before we read its dimensions
                requestAnimationFrame(function () { requestAnimationFrame(fit); });
            };
        })();

        // ── Mermaid rendering ────────────────────────────────────────────────
        window.renderMermaidDiagrams = async function () {
            if (typeof mermaid === 'undefined') {
                console.warn('Mermaid library not loaded');
                return;
            }

            // Only target unrendered diagrams to avoid re-rendering on subsequent calls.
            const diagrams = document.querySelectorAll('.mermaid[data-mermaid-b64]:not([data-rendered])');
            for (const diagram of diagrams) {
                try {
                    const b64 = diagram.getAttribute('data-mermaid-b64');
                    if (!b64) continue;
                    const code = decodeURIComponent(escape(atob(b64)));
                    const result = await mermaid.render(diagram.id + '-svg', code);
                    diagram.innerHTML = result.svg;
                    diagram.setAttribute('data-rendered', 'true');
                    diagram.style.cursor = 'zoom-in';
                    diagram.title = 'Click to enlarge';
                    diagram.addEventListener('click', () => window.openMermaidLightbox(result.svg));
                } catch (e) {
                    console.error('Mermaid rendering error:', e);
                    diagram.innerHTML = '<pre style="color:var(--error-color,#f88);font-size:12px">Failed to render diagram: ' + e.message + '</pre>';
                    diagram.setAttribute('data-rendered', 'error');
                }
            }
        };

        // Also render on page load
        window.addEventListener('DOMContentLoaded', function () {
            setTimeout(window.renderMermaidDiagrams, 500);
        });
    </script>
</body>
</html>
