<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SwebKit</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="SwebKit.App.styles.css" />
    <link rel="icon" href="data:,">
</head>
<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#x2715;</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="js/keyboardShortcuts.js"></script>
    <script src="js/monacoLoader.js"></script>
    <script src="js/splitter.js"></script>
    <script src="js/uiState.js"></script>
    <script src="js/yamlHighlight.js"></script>
    <script>
        // Initialize Mermaid for SwebKit
        window.renderMermaidDiagrams = function() {
            if (typeof mermaid === 'undefined') {
                console.warn('Mermaid library not loaded');
                return;
            }
            
            mermaid.initialize({ startOnLoad: false, theme: 'default' });
            
            var diagrams = document.querySelectorAll('.mermaid');
            diagrams.forEach(function(diagram) {
                try {
                    var sourceId = diagram.getAttribute('data-mermaid-id');
                    if (sourceId) {
                        var sourceEl = document.getElementById(sourceId);
                        if (sourceEl) {
                            var code = sourceEl.textContent;
                            var containerId = 'mermaid-render-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
                            diagram.id = containerId;
                            diagram.style.display = 'block';
                            diagram.style.minHeight = '100px';
                            mermaid.mermaidAPI.render(containerId, code, function(svgCode) {
                                diagram.innerHTML = svgCode;
                            }, diagram);
                        }
                    }
                } catch (e) {
                    console.error('Mermaid rendering error:', e);
                }
            });
        };
        
        // Also render on page load
        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(window.renderMermaidDiagrams, 500);
        });
    </script>
</body>
</html>
