<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SwebKit</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="SwebKit.App.styles.css" />
    <link rel="icon" href="data:,">
</head>
<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#x2715;</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="js/keyboardShortcuts.js"></script>
    <script src="js/monacoLoader.js"></script>
    <script src="js/splitter.js"></script>
    <script src="js/uiState.js"></script>
    <script src="js/yamlHighlight.js"></script>
    <script>
        // Initialize Mermaid for SwebKit (v10+ async API)
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });

        window.renderMermaidDiagrams = async function() {
            if (typeof mermaid === 'undefined') {
                console.warn('Mermaid library not loaded');
                return;
            }

            // Only target unrendered diagrams to avoid re-rendering on subsequent calls
            var diagrams = document.querySelectorAll('.mermaid[data-mermaid-b64]:not([data-rendered])');
            for (var i = 0; i < diagrams.length; i++) {
                var diagram = diagrams[i];
                try {
                    var b64 = diagram.getAttribute('data-mermaid-b64');
                    if (!b64) continue;
                    var code = decodeURIComponent(escape(atob(b64)));
                    var svgId = diagram.id + '-svg';
                    var result = await mermaid.render(svgId, code);
                    diagram.innerHTML = result.svg;
                    diagram.setAttribute('data-rendered', 'true');
                } catch (e) {
                    console.error('Mermaid rendering error:', e);
                    diagram.innerHTML = '<pre style="color:var(--error-color,#f88);font-size:12px">Failed to render diagram: ' + e.message + '</pre>';
                    diagram.setAttribute('data-rendered', 'error');
                }
            }
        };

        // Also render on page load
        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(window.renderMermaidDiagrams, 500);
        });
    </script>
</body>
</html>
