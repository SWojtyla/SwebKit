[package]
name = "swebkit"
version = "1.0.0"
description = "Developer Swiss army knife for Azure"
edition = "2021"

[lib]
name = "swebkit_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "4", features = ["v1"] }
portable-pty = "0.9"
base64 = "0.22"
tauri-plugin-notification = "2"
# Deep links (swebkit://): single-instance MUST come before deep-link and carry the
# "deep-link" feature on Windows — that's the piece that forwards a second launch's
# swebkit:// argv to the running instance instead of starting a duplicate app.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
